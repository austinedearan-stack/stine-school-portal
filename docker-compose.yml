version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: school_portal_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-school_portal_db}
      POSTGRES_USER: ${DB_USER:-portal_app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_postgres_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: school_portal_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: school_portal_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_data:
