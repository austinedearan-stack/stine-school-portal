[project]
name = "school-portal"
version = "0.1.0"
requires-python = ">=3.12"
description = "University student information and services portal"
# Runtime pins, identical to requirements/base.txt (Vercel installs from here; a test keeps them in sync).
dependencies = [
    "Django==5.2.18",
    "djangorestframework==3.18.3",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    "qrcode[pil]==8.2",
    "pillow==12.3.0",
    "whitenoise==6.12.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv", "venv", "staticfiles"]

[tool.ruff.lint]
# E/F/W: correctness, I: imports, B: bugbear, S: bandit-style security rules, DJ: Django rules
select = ["E", "F", "W", "I", "B", "S", "DJ", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S603", "S607", "S608"]  # S608: tests run raw SQL on purpose
"**/tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "staticfiles"]
skips = ["B101"]

[tool.coverage.run]
source = ["apps", "portal_config"]
# Entry points and the dev/production settings are exercised in subprocesses (tests/settings), which coverage
# does not trace; they are excluded here rather than counted as untested.
omit = ["*/migrations/*", "*/tests/*", "portal_config/asgi.py", "portal_config/wsgi.py",
        "portal_config/settings/collectstatic.py", "portal_config/settings/development.py",
        "portal_config/settings/production.py", "portal_config/settings/vercel.py", "api/index.py"]
branch = true

[tool.coverage.report]
fail_under = 88
skip_covered = true
show_missing = true
