{% extends "base.html" %}
{% block title %}{% if club %}Edit {{ club.name }}{% else %}New club{% endif %}{% endblock %}
{% block content %}
<div class="page-header"><div><h1>{% if club %}Edit {{ club.name }}{% else %}New club or society{% endif %}</h1></div></div>
<div class="card"><form method="post" class="form" novalidate>
  {% csrf_token %}
  {% include "partials/form.html" %}
  <button class="btn" type="submit">Save</button>
  <a class="btn btn-secondary" href="{% if club %}{% url 'clubs:detail' club.pk %}{% else %}{% url 'clubs:manage' %}{% endif %}">Cancel</a>
</form></div>
{% endblock %}
