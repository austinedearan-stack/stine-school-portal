{% extends 'base.html' %}
{% block title %}400 - Bad Request{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="bg-amber-100 text-amber-800 p-4 rounded-full mb-4">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl mb-2">400 - Invalid Request</h1>
    <p class="text-base text-slate-600 max-w-md mb-6">{{ message|default:"The server could not understand or process your request." }}</p>
    <a href="{% url 'core:dashboard' %}" class="inline-flex items-center px-4 py-2 rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">Return to Dashboard</a>
</div>
{% endblock %}
