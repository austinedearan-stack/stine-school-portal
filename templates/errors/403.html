{% extends 'base.html' %}
{% block title %}403 - Access Forbidden{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="bg-rose-100 text-rose-800 p-4 rounded-full mb-4">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl mb-2">403 - Access Forbidden</h1>
    <p class="text-base text-slate-600 max-w-md mb-6">{{ message|default:"You do not have administrative authorization to access this page or resource." }}</p>
    <a href="{% url 'core:dashboard' %}" class="inline-flex items-center px-4 py-2 rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">Return to Dashboard</a>
</div>
{% endblock %}
