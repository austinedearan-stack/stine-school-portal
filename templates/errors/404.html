{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="bg-indigo-100 text-indigo-800 p-4 rounded-full mb-4">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl mb-2">404 - Not Found</h1>
    <p class="text-base text-slate-600 max-w-md mb-6">{{ message|default:"The requested record, page, or resource does not exist or may have been relocated." }}</p>
    <a href="{% url 'core:dashboard' %}" class="inline-flex items-center px-4 py-2 rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">Return to Dashboard</a>
</div>
{% endblock %}
