{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card card">
  <h1>Sign in</h1>
  <form method="post" action="{% url 'accounts:login' %}" class="form" novalidate>
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% include "partials/form.html" %}
    <button type="submit" class="btn">Sign in</button>
  </form>
  <p class="small"><a href="{% url 'accounts:password_reset_request' %}">Forgot your password?</a></p>
</div></div>
{% endblock %}
