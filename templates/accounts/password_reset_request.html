{% extends 'base.html' %}
{% block title %}Reset Password - University Portal{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="text-center text-2xl font-bold text-slate-900">Account Password Recovery</h2>
        <p class="mt-2 text-center text-sm text-slate-600">Enter your student ID or email to receive password reset instructions.</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-md sm:rounded-xl sm:px-10 border border-slate-200">
            <form method="POST" action="{% url 'accounts:password_reset_request' %}" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-700">Identification / Email</label>
                    <input type="text" name="identifier" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="e.g. STU2026001 or email">
                </div>
                <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm shadow-sm cursor-pointer">
                    Send Reset Instructions
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="{% url 'accounts:login' %}" class="text-xs text-indigo-600 hover:underline">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
