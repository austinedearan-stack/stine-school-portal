{% extends "base.html" %}
{% block title %}Enter reset code{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card card">
  <h1>Choose a new password</h1>
  <p class="muted">Enter the code from the email and your new password. Codes expire after 20 minutes.</p>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {% include "partials/form.html" %}
    <button type="submit" class="btn">Reset password</button>
  </form>
  <p class="small"><a href="{% url 'accounts:password_reset_request' %}">Send a new code</a></p>
</div></div>
{% endblock %}
