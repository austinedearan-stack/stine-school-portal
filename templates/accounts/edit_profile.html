{% extends "base.html" %}
{% block title %}Edit contact details{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Edit contact details</h1><p>Academic and institutional details can only be changed by the registrar.</p></div></div>
<div class="card"><form method="post" class="form" novalidate>
  {% csrf_token %}
  {% include "partials/form.html" %}
  <button type="submit" class="btn">Save</button>
  <a class="btn btn-secondary" href="{% url 'accounts:profile' %}">Cancel</a>
</form></div>
{% endblock %}
