{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn-secondary btn-small" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
  <span class="muted small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-secondary btn-small" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
