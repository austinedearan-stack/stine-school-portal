# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: portal-secret-scan
        name: portal secret scan (staged files)
        entry: python scripts/secret_scan.py --staged
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: bandit -q -ll -c pyproject.toml -r apps portal_config
        language: system
        pass_filenames: false
