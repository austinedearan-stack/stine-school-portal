name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci-only-not-a-secret  # secret-scan: allow (ephemeral CI container)
          POSTGRES_DB: school_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_owner" --health-interval 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: school_portal
      DB_USER: ci_owner
      DB_PASSWORD: ci-only-not-a-secret  # secret-scan: allow
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install -r requirements/dev.txt
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Lint
        run: ruff check .
      - name: Bandit
        run: bandit -q -ll -c pyproject.toml -r apps portal_config
      - name: Dependency audit
        run: pip-audit -r requirements/prod.txt
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run --settings=portal_config.settings.testing
      - name: PostgreSQL 16 client (backup and restore test)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Tests (PostgreSQL)
        run: |
          pg_dump --version
          pytest --cov --cov-report=term-missing
      - name: Deploy checks with production settings
        env:
          DJANGO_SETTINGS_MODULE: portal_config.settings.production
          DJANGO_SECRET_KEY: ${{ github.run_id }}-ci-only-random-key-${{ github.sha }}
          DJANGO_ALLOWED_HOSTS: portal.example.test
          DB_USER: portal_app
          DB_SSLMODE: require
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Throw-away keys generated for this check only.
          export MFA_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export PORTAL_HMAC_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python manage.py check --deploy --fail-level WARNING

  deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Production compose file is valid
        run: |
          mkdir -p ci-env
          for f in deploy/env/*.env.example; do cp "$f" "ci-env/$(basename "$f" .example)"; done
          export PORTAL_HOST=portal.example.test \
            PORTAL_ENV_FILE="$PWD/ci-env/portal.env" PORTAL_OWNER_ENV_FILE="$PWD/ci-env/owner.env" \
            PORTAL_BACKUP_ENV_FILE="$PWD/ci-env/backup.env" PORTAL_DB_ENV_FILE="$PWD/ci-env/db.env" \
            PORTAL_REDIS_ENV_FILE="$PWD/ci-env/redis.env"
          report() {  # $1 = title; stdin = tool output -> one ::error annotation
            out=$(cat); out=${out//'%'/'%25'}; out=${out//$'\r'/}; out=${out//$'\n'/'%0A'}
            echo "::error title=$1::$out"
          }
          docker compose -f docker-compose.prod.yml config -q > compose.log 2>&1 \
            || { report "docker compose config" < compose.log; exit 1; }
      - name: Nginx configuration test
        run: |
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=portal.example.test" \
            -keyout tls/privkey.pem -out tls/fullchain.pem
          report() {  # $1 = title; stdin = tool output -> one ::error annotation
            out=$(cat); out=${out//'%'/'%25'}; out=${out//$'\r'/}; out=${out//$'\n'/'%0A'}
            echo "::error title=$1::$out"
          }
          docker pull -q nginx:1.28-alpine > /dev/null
          docker run --rm --add-host web:127.0.0.1 \
            -e PORTAL_HOST=portal.example.test -e NGINX_ENVSUBST_FILTER='^PORTAL_' \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" -v "$PWD/tls:/etc/nginx/tls:ro" \
            nginx:1.28-alpine nginx -t > nginx.log 2>&1 || { report "nginx -t" < nginx.log; exit 1; }
      - name: Shell scripts
        run: |
          report() {  # $1 = title; stdin = tool output -> one ::error annotation
            out=$(cat); out=${out//'%'/'%25'}; out=${out//$'\r'/}; out=${out//$'\n'/'%0A'}
            echo "::error title=$1::$out"
          }
          shellcheck deploy/postgres/init/01-roles.sh deploy/scripts/offsite_copy.sh > shellcheck.log 2>&1 \
            || { report "shellcheck" < shellcheck.log; exit 1; }
